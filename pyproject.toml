[project]
name = "context-engineering-runtime"
version = "0.1.0"
description = "Provider-agnostic runtime that treats LLM context as a managed, budgeted, evictable resource."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chirag Borse", email = "chiragborse877@gmail.com" }]
keywords = [
  "llm",
  "agents",
  "context-engineering",
  "prompt-caching",
  "agent-runtime",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4,<1"]
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]
ollama = ["httpx>=0.27"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.111",
  "ruff>=0.7",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/chiragborse1/context-engineering-runtime"
Issues = "https://github.com/chiragborse1/context-engineering-runtime/issues"
Changelog = "https://github.com/chiragborse1/context-engineering-runtime/blob/main/CHANGELOG.md"

[project.scripts]
cer = "cer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "ANN",      # annotations
  "D",        # pydocstyle
  "S",        # bandit
  "BLE",      # blind except
  "ARG",      # unused args
  "PTH",      # pathlib
  "TID",      # tidy imports
  "PL",       # pylint subset
  "TRY",      # tryceratops
  "EM",       # error messages
  "G",        # logging format
  "FA",       # future annotations
]
ignore = [
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ANN401", # dynamic Any, allowed only where documented
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN", "PLR2004", "S105", "S106"]
"bench/**" = ["D100", "D101", "PLR2004"]
"examples/**" = ["D100", "D103", "T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cer"]
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "fastembed.*", "httpx.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=cer",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=80",
]
markers = [
  "slow: long-running tests, deselect with -m not slow",
  "benchmark: pytest-benchmark performance tests",
  "integration: exercises multiple components together",
  "legibility: legibility invariant tests, gated in CI",
  "network: requires network access, excluded in CI",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/cer"]
omit = ["*/cli.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
